replicaCount: 1

image:
  repository: ghcr.io/stark3rn/ntiers/php-fpm
  tag: latest
  pullPolicy: Always

service:
  clusterIP: 10.43.89.247   # php.riz-goler.fr
  port: 9000

env:
  - name: REDIS_HOST
    value: hap.riz-goler.fr
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_PASSWORD
    value: "changeme-redis"
  - name: MONGODB_URI
    value: "mongodb://ntiers:changeme-mongodb-user@hap.riz-goler.fr:27017/ntiers"
  - name: MONGODB_DATABASE
    value: "ntiers"
  - name: STATIC_BASE_URL
    value: "http://nfs.riz-goler.fr"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
