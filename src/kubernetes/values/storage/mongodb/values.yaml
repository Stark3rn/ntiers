architecture: replicaset
replicaCount: 2

auth:
  enabled: true
  rootPassword: "changeme-mongodb-root"
  usernames:
    - ntiers
  passwords:
    - "changeme-mongodb-user"
  databases:
    - ntiers

persistence:
  enabled: true
  size: 8Gi

service:
  type: ClusterIP
  ports:
    mongodb: 27017

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

livenessProbe:
  timeoutSeconds: 15
readinessProbe:
  timeoutSeconds: 15
