architecture: replication

auth:
  enabled: true
  password: "changeme-redis"

master:
  persistence:
    enabled: true
    size: 4Gi
  service:
    type: ClusterIP
    ports:
      redis: 6379
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

replica:
  replicaCount: 2
  persistence:
    enabled: true
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
