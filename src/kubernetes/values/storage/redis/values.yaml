architecture: replication

auth:
  enabled: true
  password: "changeme-redis"

master:
  persistence:
    enabled: true
    size: 4Gi
  service:
    type: ClusterIP
    clusterIP: 10.43.161.29   # rd.riz-goler.fr
    ports:
      redis: 6379
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    timeoutSeconds: 10
  readinessProbe:
    timeoutSeconds: 5

replica:
  replicaCount: 2
  persistence:
    enabled: true
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    timeoutSeconds: 10
  readinessProbe:
    timeoutSeconds: 5
