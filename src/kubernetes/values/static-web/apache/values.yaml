nfs:
  # = nfsd.riz-goler.fr (ClusterIP figée, values/static-web/nfs-server).
  # EXCEPTION à la règle « on passe par BIND » : le montage NFS est fait par le
  # kubelet sur l'hôte du nœud, dont le résolveur ne passe pas par BIND. À
  # remplacer par "nfsd.riz-goler.fr" une fois le split DNS Tailscale en place.
  # Ne pas utiliser "nfs.riz-goler.fr" : c'est le site HTTP (Traefik).
  server: "10.43.26.41"
  path: "/"

service:
  clusterIP: 10.43.189.143   # apache.riz-goler.fr

ingress:
  enabled: true
  className: traefik
  host: "nfs.riz-goler.fr"

files:
  about-html: |
    <!doctype html>
    <html lang="fr">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>À propos — Riz-Goler</title>
      <link rel="icon" href="/logo/riz-goler-icon.svg">
      <link rel="stylesheet" href="/css/site.css">
    </head>
    <body>
    <header>
      <nav>
        <a href="http://web.riz-goler.fr/"><img src="/logo/riz-goler-reduit.svg" alt="Riz-Goler" class="nav-logo"></a>
        <a href="http://web.riz-goler.fr/">Accueil</a>
        <a href="/about.html" class="active">À propos</a>
        <a href="http://web.riz-goler.fr/blagues">Blagues</a>
      </nav>
    </header>
    <main>
      <h1>À propos de Riz-Goler</h1>
      <p>
        Riz-Goler est né d'une idée toute simple : et si on riait autant qu'on mange de riz ?
        Ce site est un espace sans compte, sans friction, où n'importe qui peut venir déposer
        sa meilleure (ou sa pire) blague de riz, et repartir avec le sourire.
      </p>
      <p>
        Pas de modération lourde, pas de formulaire interminable : on valide juste que ta
        blague tient debout, et hop, elle rejoint la liste.
      </p>
      <p>
        Ce site fait partie de <strong>ntiers</strong>, une infrastructure n-tiers pédagogique
        déployée sur un cluster Kubernetes.
      </p>
    </main>
    <footer>
      <p>&copy; <span id="year"></span> Riz-Goler — Cuisine joyeuse &amp; conviviale.</p>
    </footer>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
    </body>
    </html>

  site-css: |
    :root {
      --rg-blue: #2E7BC6;
      --rg-blue-dark: #1C5FA8;
      --rg-orange: #EF7D33;
      --rg-cream: #F7F2E7;
      --rg-navy: #1C2B4A;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Baloo 2', 'Comic Sans MS', system-ui, sans-serif;
      background: var(--rg-cream);
      color: var(--rg-navy);
    }

    header nav {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      padding: 1rem 2rem;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    header nav .nav-logo {
      height: 40px;
    }

    header nav a {
      color: var(--rg-navy);
      text-decoration: none;
      font-weight: 700;
    }

    header nav a.active,
    header nav a:hover {
      color: var(--rg-orange);
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .hero {
      text-align: center;
      padding: 2rem 0;
    }

    .hero .logo {
      max-width: 320px;
      width: 100%;
      height: auto;
    }

    .hero h1 {
      color: var(--rg-blue-dark);
      font-size: 2.4rem;
      margin: 0.5rem 0;
    }

    .cta {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      background: var(--rg-orange);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 999px;
    }

    .joke-form {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: #fff;
      padding: 1.2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      margin-bottom: 2rem;
    }

    .joke-form textarea {
      min-height: 90px;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.6rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      resize: vertical;
    }

    .joke-form input[type="text"] {
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
    }

    .joke-form button {
      align-self: flex-start;
      background: var(--rg-blue);
      color: #fff;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }

    .errors {
      color: #b3261e;
      padding-left: 1.2rem;
    }

    .jokes-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.8rem;
    }

    .jokes-list li {
      background: #fff;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .jokes-list .author {
      display: block;
      margin-top: 0.4rem;
      font-size: 0.85rem;
      color: var(--rg-blue-dark);
      font-weight: 700;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: #8a8578;
      font-size: 0.85rem;
    }

