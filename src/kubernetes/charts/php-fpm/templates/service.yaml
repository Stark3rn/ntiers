apiVersion: v1
kind: Service
metadata:
  name: {{ include "php-fpm.fullname" . }}
  labels:
    {{- include "php-fpm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  {{- if .Values.service.clusterIP }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- end }}
  ports:
    - name: fastcgi
      port: {{ .Values.service.port }}
      targetPort: fastcgi
  selector:
    {{- include "php-fpm.selectorLabels" . | nindent 4 }}
