apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "apache-static.fullname" . }}-nfs-pv
  labels:
    {{- include "apache-static.labels" . | nindent 4 }}
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4
  nfs:
    server: {{ .Values.nfs.server }}
    path: {{ .Values.nfs.path }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "apache-static.fullname" . }}-nfs-pvc
  labels:
    {{- include "apache-static.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: {{ include "apache-static.fullname" . }}-nfs-pv
  resources:
    requests:
      storage: 1Gi
