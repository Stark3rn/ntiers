apiVersion: v1
kind: Service
metadata:
  name: {{ include "nfs-server.fullname" . }}
  labels:
    {{- include "nfs-server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  {{- if .Values.service.clusterIP }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- end }}
  ports:
    - name: nfs
      port: {{ .Values.service.port }}
      targetPort: nfs
      protocol: TCP
  selector:
    {{- include "nfs-server.selectorLabels" . | nindent 4 }}
