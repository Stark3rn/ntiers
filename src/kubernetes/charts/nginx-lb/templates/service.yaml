apiVersion: v1
kind: Service
metadata:
  name: {{ include "nginx-lb.fullname" . }}
  labels:
    {{- include "nginx-lb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.clusterIP }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "nginx-lb.selectorLabels" . | nindent 4 }}
