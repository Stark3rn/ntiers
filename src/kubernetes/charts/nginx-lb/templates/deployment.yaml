apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nginx-lb.fullname" . }}
  labels:
    {{- include "nginx-lb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nginx-lb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nginx-lb.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/conf: {{ tpl .Values.serverBlock . | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: conf
          configMap:
            name: {{ include "nginx-lb.fullname" . }}-conf
